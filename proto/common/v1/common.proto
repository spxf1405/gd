syntax = "proto3";

package common.v1;

option go_package = "backend/internal/gen/common/v1;commonpb";

enum AuthError {
  AUTH_ERROR_UNSPECIFIED = 0;
  AUTH_ERROR_INVALID_ACCESS_TOKEN = 1;
  AUTH_ERROR_INVALID_REFRESH_TOKEN = 2;
  AUTH_ERROR_REFRESH_TOKEN_REUSED = 3;
  AUTH_ERROR_DEVICE_MISMATCH = 4;
  AUTH_ERROR_SESSION_EXPIRED = 5;
  AUTH_ERROR_SESSION_REVOKED = 6;
  AUTH_ERROR_SOFT_LOGIN_REQUIRED = 7;
  AUTH_ERROR_SOFT_LOGIN_FAILED = 8;
}

enum SessionRevokeReason {
  SESSION_REVOKE_REASON_UNSPECIFIED = 0;
  SESSION_REVOKE_REASON_ROTATED = 1;
  SESSION_REVOKE_REASON_LOGGED_OUT = 2;
  SESSION_REVOKE_REASON_FORCE_LOGGED_OUT = 3;
  SESSION_REVOKE_REASON_TOKEN_REUSE_DETECTED = 4;
  SESSION_REVOKE_REASON_EXPIRED = 5;
  SESSION_REVOKE_REASON_PASSWORD_CHANGED = 6;
  SESSION_REVOKE_REASON_USER_DISABLED = 7;
}

message AuthErrorDetail {
  AuthError reason = 1;

  bool force_logout = 2;
  bool revoke_all_sessions = 3;
}